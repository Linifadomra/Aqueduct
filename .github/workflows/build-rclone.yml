name: Build librclone
on:
  push:
    tags: ["librclone-v*"]

env:
  RCLONE_VERSION: "v1.68.2"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Clone rclone
        run: git clone --depth 1 --branch ${{ env.RCLONE_VERSION }} https://github.com/rclone/rclone.git
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build librclone.so
        working-directory: rclone
        run: go build --buildmode=c-shared -o ../librclone.so ./librclone
      - uses: actions/upload-artifact@v4
        with:
          name: librclone-linux
          path: librclone.so

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Clone rclone
        run: git clone --depth 1 --branch ${{ env.RCLONE_VERSION }} https://github.com/rclone/rclone.git
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      # rclone's cgo build needs a GCC-compatible compiler on Windows
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Build librclone.dll
        shell: msys2 {0}
        working-directory: rclone
        run: go build --buildmode=c-shared -o ../librclone.dll ./librclone
      - uses: actions/upload-artifact@v4
        with:
          name: librclone-windows
          path: librclone.dll

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            librclone-linux/librclone.so
            librclone-windows/librclone.dll
